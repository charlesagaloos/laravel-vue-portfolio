services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-Charles Agaloos}"
      APP_ENV: production
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_KEY: "${APP_KEY:?Set APP_KEY in .env.docker}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-portfolio}"
      DB_USERNAME: "${DB_USERNAME:-portfolio}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - app

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-portfolio}"
      MYSQL_USER: "${DB_USERNAME:-portfolio}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}"
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - portfolio_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  portfolio_mysql_data:
